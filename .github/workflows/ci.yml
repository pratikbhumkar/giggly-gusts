name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore GigglyGusts.sln

      - name: Format (verify no changes)
        run: dotnet format GigglyGusts.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GigglyGusts.sln --no-restore

      - name: Test
        run: dotnet test GigglyGusts.sln --no-build --verbosity normal
