name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal GITHUB_TOKEN: clone repo + allow actions/cache to restore/save keys.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore GigglyGusts.sln

      - name: Format (verify no changes)
        run: dotnet format GigglyGusts.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GigglyGusts.sln --no-restore

      - name: Test
        run: dotnet test GigglyGusts.sln --no-build --verbosity normal

  terraform:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.5.0
        ports:
          - 4566:4566
        env:
          SERVICES: iam,lambda,logs,sts
          LS_LOG: warn
    env:
      TF_VAR_use_localstack: "true"
      TF_VAR_localstack_endpoint: "http://127.0.0.1:4566"
      TF_VAR_container_image: "public.ecr.aws/lambda/dotnet:8"
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null; then
              echo "LocalStack is ready"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time"
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false
