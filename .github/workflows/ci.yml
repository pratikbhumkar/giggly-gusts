name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal GITHUB_TOKEN: clone repo + allow actions/cache to restore/save keys.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_ENVIRONMENT: Development
      # CI never hits the real Open-Meteo: live-path tests use HttpMessageHandler fakes.
      # MaintenanceMode is asserted via in-memory configuration inside the tests; keep the
      # process default off so unrelated tests behave like normal traffic.
      Weather__UseOpenMeteo: "false"
      Weather__MaintenanceMode: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore GigglyGusts.sln

      - name: Format (verify no changes)
        run: dotnet format GigglyGusts.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build GigglyGusts.sln --no-restore

      - name: Test
        run: dotnet test GigglyGusts.sln --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: [ci]
    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAME: giggly-gusts-api
      # Must match aws_lambda_function.api.architectures in infra/compute.tf.
      IMAGE_PLATFORM: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation on amd64 runner)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "Build image (Mode A: no registry push)"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image architecture matches Lambda (arm64)
        run: |
          set -euo pipefail
          arch=$(docker image inspect --format '{{.Architecture}}' "${IMAGE_NAME}:${IMAGE_TAG}")
          echo "image arch: ${arch}"
          if [ "${arch}" != "arm64" ]; then
            echo "expected arm64 to match aws_lambda_function.api.architectures, got ${arch}" >&2
            exit 1
          fi

      - name: Smoke test /health and /weather (under QEMU)
        run: |
          set -euo pipefail
          docker run -d --rm --name gg-smoke \
            --platform "${IMAGE_PLATFORM}" \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            "${IMAGE_NAME}:${IMAGE_TAG}"
          trap 'docker logs gg-smoke || true; docker rm -f gg-smoke || true' EXIT
          # arm64 .NET startup under QEMU on an amd64 runner is slow; allow up to ~90s.
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "health is up after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "container did not become healthy in time" >&2
              exit 1
            fi
          done
          curl -fsS "http://127.0.0.1:8080/weather?city=Sydney" \
            | grep -q '"city":"Sydney"'

  terraform:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.5.0
        ports:
          - 4566:4566
        env:
          SERVICES: iam,lambda,logs,sts,ecr
          LS_LOG: warn
    env:
      TF_VAR_use_localstack: "true"
      TF_VAR_localstack_endpoint: "http://127.0.0.1:4566"
      TF_VAR_container_image: "public.ecr.aws/lambda/dotnet:8"
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for LocalStack
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null; then
              echo "LocalStack is ready"
              exit 0
            fi
            sleep 2
          done
          echo "LocalStack did not become healthy in time"
          exit 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform format (check)
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false
